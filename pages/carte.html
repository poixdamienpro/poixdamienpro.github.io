<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Carte des fournisseurs en Europe · Buy-inner</title>
<meta name="description" content="Carte interactive des fabricants et prestataires industriels référencés sur Buy-inner en Europe : localisez les fournisseurs par ville, région et industrie."/>
<meta name="robots" content="index,follow"/>
<link rel="canonical" href="https://www.buy-inner.com/pages/carte.html"/>
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="Buy-inner"/>
<meta property="og:title" content="Carte des fournisseurs en Europe · Buy-inner"/>
<meta property="og:description" content="Localisez les fabricants et prestataires industriels référencés sur Buy-inner, partout en Europe."/>
<meta property="og:locale" content="fr_FR"/>
<meta property="og:url" content="https://www.buy-inner.com/pages/carte.html"/>
<meta property="og:image" content="https://www.buy-inner.com/assets/logo-512.png"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../css/styles.css"/>
<link rel="icon" href="../assets/favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png"/>
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<script>window.ROOT_PREFIX = '../'; window.CURRENT_PAGE = 'carte';</script>
<script src="../js/analytics.js"></script>
<style>
#map-canvas{position:absolute;inset:0;background:#E5E3DD}
.dir-map{grid-template-columns:225px 1fr}
.map-wrap{position:relative;height:calc(100vh - 192px);min-height:520px}
@media(max-width:1100px){.dir-map{grid-template-columns:210px 1fr}}
@media(max-width:760px){
  .dir-map{grid-template-columns:1fr}
  .dir-map .dir-list-col{order:1}
  .dir-map .sidebar{order:2;height:auto}
  .dir-map .map-wrap{height:65vh;min-height:360px}
}
.map-empty-note{display:none;position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:1000;
  background:rgba(14,22,29,.92);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:10px 18px;
  font-family:var(--mono);font-size:12px;color:rgba(243,241,236,.7)}
.map-dot{width:14px;height:14px;border-radius:50%;background:#D4500A;border:2px solid #16222E;box-shadow:0 0 0 3px rgba(212,80,10,.25)}
.map-cluster{width:36px;height:36px;border-radius:50%;background:#5B8BB5;border:2px solid #16222E;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:13px;color:#F3F1EC;
  box-shadow:0 0 0 4px rgba(91,139,181,.25)}
.leaflet-popup-content-wrapper{background:#18242E;color:#F3F1EC;border-radius:10px}
.leaflet-popup-tip{background:#18242E}
.map-popup-name{font-family:var(--serif);font-size:16px;margin-bottom:4px}
.map-popup-loc{font-family:var(--mono);font-size:11px;color:rgba(243,241,236,.55);margin-bottom:2px}
.map-popup-industry{font-family:var(--mono);font-size:11px;color:#8FB4D6;margin-bottom:8px}
.map-popup-link{display:inline-block;font-size:12px;font-weight:700;color:#F0975C;text-decoration:none}
.map-popup-link:hover{text-decoration:underline}
.leaflet-control-zoom a{background:#18242E!important;color:#F3F1EC!important;border-color:rgba(255,255,255,.15)!important}
.leaflet-control-attribution{background:rgba(14,22,29,.8)!important;color:rgba(243,241,236,.5)!important}
.leaflet-control-attribution a{color:#8FB4D6!important}
</style>
</head>
<body class="theme-dark">

<div id="nav-slot"></div>

<div class="page-header">
  <div class="page-header-inner">
    <div>
      <h1 class="page-title">Carte des <span id="map-type-title">fournisseurs</span> en Europe</h1>
      <p class="page-subtitle">Localisez les fabricants, prestataires et systémiers référencés, ville par ville.</p>
    </div>
    <div class="kpi-row">
      <div class="kpi"><div><div class="kpi-n" id="kpi-mapped">—</div><div class="kpi-l">Localisées</div></div></div>
      <div class="kpi"><div><div class="kpi-n" id="kpi-total">—</div><div class="kpi-l">Entreprises au total</div></div></div>
    </div>
  </div>
</div>

<div class="dir dir-map">
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Type</div>
      <div class="chip-group" id="map-type-chips">
        <button class="chip active" data-type="fournisseurs" onclick="setMapType('fournisseurs')">Fournisseurs</button>
        <button class="chip" data-type="prestataires" onclick="setMapType('prestataires')">Prestataires</button>
        <button class="chip" data-type="systemiers" onclick="setMapType('systemiers')">Systémiers</button>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Industrie</div>
      <div class="chip-group" id="map-industry-chips"></div>
    </div>
    <button class="reset-btn" onclick="resetMap()">↺ Réinitialiser</button>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section">
      <span class="toolbar-label">// CARTE</span><span class="result-count" id="map-count"></span>
    </div>
  </aside>
  <div class="dir-list-col">
    <div class="map-wrap">
      <div id="map-canvas"></div>
      <div class="map-empty-note" id="map-empty-note">Aucune entreprise géolocalisée pour l'instant.</div>
    </div>
  </div>
</div>

<div id="modals-slot"></div>
<div id="footer-slot"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/data.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/api.js"></script>
<script src="../js/chips.js"></script>
<script src="../js/pages/carte.js"></script>
</body>
</html>
