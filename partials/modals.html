<!-- MODALS -->
<div class="overlay" id="compare-overlay">
  <div class="cmp-modal">
    <div class="cmp-head">
      <h2>Comparaison technique</h2>
      <button style="background:transparent;border:1px solid var(--border);color:var(--muted);font-size:12px;border-radius:4px;padding:5px 12px" onclick="closeModal('compare-overlay')">✕ Fermer</button>
    </div>
    <div style="overflow-x:auto" id="compare-table-wrap"></div>
  </div>
</div>

<!-- LEAD / REQUEST QUOTE MODAL -->
<div class="overlay" id="lead-overlay">
  <div class="modal lead-modal">
    <div class="modal-head">
      <div class="modal-head-row">
        <div class="modal-name" style="font-size:18px">Demander un devis</div>
        <button class="modal-close" onclick="closeModal('lead-overlay')">✕</button>
      </div>
      <div class="modal-location" id="lead-target" style="margin-top:6px"></div>
    </div>
    <div class="modal-body" id="lead-body">
      <p class="lead-intro">C'est gratuit. Votre demande est transmise au fournisseur, qui choisit de vous recontacter ou non — vous ne serez jamais inscrit à une liste de diffusion.</p>
      <form id="lead-form" onsubmit="submitLeadForm(event)">
        <div class="lead-field"><label>Nom complet</label><input type="text" id="lead-name" required/></div>
        <div class="lead-field"><label>Email professionnel</label><input type="email" id="lead-email" required/></div>
        <div class="lead-field"><label>Entreprise</label><input type="text" id="lead-company" required/></div>
        <div class="lead-field"><label>Votre besoin</label><textarea id="lead-need" required placeholder="Quantité, contraintes techniques, délai…"></textarea></div>
        <button type="submit" class="btn-quote" style="width:100%;justify-content:center">📩 Envoyer la demande</button>
      </form>
    </div>
  </div>
</div>

<!-- COMPARE BANNER -->
<div class="compare-banner" id="compare-banner">
  <span style="font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.5)" id="compare-count">0/4</span>
  <div class="compare-pills" id="compare-pills"></div>
  <button class="btn-compare" onclick="openCompareModal()">Comparer →</button>
</div>

<datalist id="industry-list"></datalist>
